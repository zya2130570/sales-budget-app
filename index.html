<!doctype html>
<html lang="en" style="overflow-x:hidden; max-width:100vw;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow — Personal Finance</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { overflow-x: hidden; max-width: 100vw; }

      /* ── Print / PDF export styles ── */
      @media print {
        header, .print\:hidden { display: none !important; }
        body { background: white !important; color: black !important; }
        .rounded-2xl, .rounded-xl { border: 1px solid #ccc !important; }
        .bg-slate-800\/60, .bg-slate-800, .bg-slate-900 { background: white !important; }
        .text-slate-100, .text-slate-200, .text-slate-300 { color: #111 !important; }
        .text-slate-400, .text-slate-500 { color: #555 !important; }
        .space-y-4 > * { break-inside: avoid; }
      }

      /* Hide scrollbar while keeping scroll functionality */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
