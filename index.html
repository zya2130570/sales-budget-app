<!doctype html>
<html lang="en" style="overflow-x:hidden; max-width:100vw;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow — Personal Finance</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { overflow-x: hidden; max-width: 100vw; }

      /* ── Light theme ── */
      [data-theme="light"] {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
      }
      [data-theme="light"] .bg-slate-800\/80,
      [data-theme="light"] .bg-slate-800\/60,
      [data-theme="light"] .bg-slate-800\/70,
      [data-theme="light"] .bg-slate-800,
      [data-theme="light"] .min-h-screen { background-color: #f1f5f9 !important; }
      [data-theme="light"] .rounded-2xl,
      [data-theme="light"] .rounded-xl { background-color: #ffffff !important; }
      [data-theme="light"] .bg-slate-900\/50 { background-color: #e2e8f0 !important; }
      [data-theme="light"] .bg-slate-700 { background-color: #e2e8f0 !important; }
      [data-theme="light"] button.bg-slate-700 { color: #334155 !important; }
      [data-theme="light"] .text-slate-100,
      [data-theme="light"] .text-slate-200,
      [data-theme="light"] .text-slate-300 { color: #1e293b !important; }
      [data-theme="light"] .text-slate-400 { color: #475569 !important; }
      [data-theme="light"] .text-slate-500,
      [data-theme="light"] .text-slate-600 { color: #64748b !important; }
      [data-theme="light"] .border-slate-700,
      [data-theme="light"] .border-slate-700\/60,
      [data-theme="light"] .border-slate-700\/40,
      [data-theme="light"] .border-slate-700\/30,
      [data-theme="light"] .border-slate-800 { border-color: #cbd5e1 !important; }
      [data-theme="light"] input:not([type="checkbox"]):not([type="radio"]),
      [data-theme="light"] select,
      [data-theme="light"] textarea {
        background-color: #f8fafc !important; color: #0f172a !important; border-color: #94a3b8 !important;
      }
      [data-theme="light"] tbody tr,
      [data-theme="light"] .border-t,
      [data-theme="light"] .border-b { border-color: #e2e8f0 !important; }
      [data-theme="light"] .hover\:bg-slate-700:hover { background-color: #cbd5e1 !important; }
      [data-theme="light"] .hover\:bg-slate-600:hover { background-color: #e2e8f0 !important; }

      /* ── Print── Print / PDF export styles ── */
      @media print {
        header, .print\:hidden { display: none !important; }
        body { background: white !important; color: black !important; }
        .rounded-2xl, .rounded-xl { border: 1px solid #ccc !important; }
        .bg-slate-800\/60, .bg-slate-800, .bg-slate-900 { background: white !important; }
        .text-slate-100, .text-slate-200, .text-slate-300 { color: #111 !important; }
        .text-slate-400, .text-slate-500 { color: #555 !important; }
        .space-y-4 > * { break-inside: avoid; }
      }

      /* Hide scrollbar while keeping scroll functionality */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
